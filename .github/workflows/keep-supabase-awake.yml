name: Keep Supabase project awake

# Supabase free-tier projects auto-pause after 7 days with no API activity.
# A paused project isn't reachable from the live site until someone manually
# restores it in the dashboard. Ping twice a week (well under the 7-day
# window, with margin for a late/skipped run) so it never gets there.
on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -H "apikey: sb_publishable_42A5JpKb4rTKpUHl6Jh_kA_i35l9tPu" \
            "https://erkiyfvinmhduztnzecd.supabase.co/rest/v1/" -o /dev/null
